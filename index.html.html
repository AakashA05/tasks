<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tasks</title>
<style>
  :root {
    --bg: #FAFAF7;
    --surface: #FAFAF7;
    --text: #1A1A1A;
    --muted: #74746E;
    --faint: #B4B3AC;
    --hair: #D8D6CE;
    --divider: #EEEBE2;
    --accent: #4A7A3A;
    --star: #C89A3C;
    --snooze: #7A8CAE;
    --stale-mid: #96958E;
    --stale-old: #A86A5C;
    --danger: #A04040;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15150F;
      --surface: #15150F;
      --text: #ECECE6;
      --muted: #86867E;
      --faint: #4E4E46;
      --hair: #2E2E26;
      --divider: #1F1F19;
      --accent: #9BC77F;
      --star: #D9B460;
      --snooze: #8DA0C4;
      --stale-mid: #6E6D66;
      --stale-old: #C47878;
      --danger: #C47878;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    background-color: var(--bg);
  }

  html, body {
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: transparent;
    max-width: 1040px;
    margin: 0 auto;
    padding: 48px 24px 140px;
  }

  /* List tabs (work / private) */
  .list-tabs {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  .list-tabs .tab {
    background: none;
    border: none;
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 0;
    border-bottom: 1.5px solid transparent;
    letter-spacing: 0.02em;
    transition: color 0.15s, border-color 0.15s;
  }
  .list-tabs .tab:hover { color: var(--text); }
  .list-tabs .tab.active {
    color: var(--text);
    border-bottom-color: var(--text);
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 32px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.01em;
  }
  header .date { color: var(--text); }
  header .counts { font-variant-numeric: tabular-nums; }

  /* Input */
  .input-wrap {
    position: relative;
    margin-bottom: 24px;
  }
  input.add {
    width: 100%;
    padding: 14px 120px 14px 16px;
    font: inherit;
    font-size: 15px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--hair);
    border-radius: 2px;
    outline: none;
    transition: border-color 0.15s;
  }
  input.add:focus { border-color: var(--text); }
  input.add::placeholder { color: var(--faint); }
  .hint-key {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--faint);
    pointer-events: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  input.add:focus ~ .hint-key { display: none; }

  .add-today {
    position: absolute;
    right: 36px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    padding: 4px 10px;
    letter-spacing: 0.02em;
    border-radius: 2px;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: color 0.15s, background 0.15s;
  }
  .add-today:hover {
    color: var(--text);
    background: var(--hair);
  }
  .add-today:hover .star-glyph { color: var(--star); }
  .add-today .star-glyph {
    font-size: 14px;
    color: var(--faint);
    line-height: 1;
    transition: color 0.15s;
  }

  /* Autocomplete */
  .autocomplete {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 2px);
    background: var(--bg);
    border: 1px solid var(--hair);
    border-radius: 2px;
    z-index: 10;
    display: none;
    overflow: hidden;
  }
  .autocomplete.show { display: block; }
  .autocomplete .item {
    padding: 8px 14px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .autocomplete .item .hash { color: var(--faint); }
  .autocomplete .item.active,
  .autocomplete .item:hover {
    background: var(--hair);
  }

  /* Filters */
  .filters {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--hair);
    flex-wrap: wrap;
  }
  .filter-buttons { display: flex; gap: 20px; }
  .filters button {
    background: none;
    border: none;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 0;
    letter-spacing: 0.01em;
  }
  .filters button:hover { color: var(--text); }
  .filters button.active { color: var(--text); font-weight: 500; }

  /* Clean button — hides checked tasks from Open view */
  .clean-btn { display: none; margin-left: 4px; }
  .clean-btn.show { display: inline-block; }
  .clean-btn .check { color: var(--accent); margin-left: 2px; }

  /* Search */
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
    max-width: 320px;
  }
  .search {
    width: 100%;
    padding: 5px 26px 5px 10px;
    font: inherit;
    font-size: 13px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--hair);
    border-radius: 2px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search:focus { border-color: var(--text); }
  .search::placeholder { color: var(--faint); }
  .search-clear {
    position: absolute;
    right: 2px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--faint);
    cursor: pointer;
    font-size: 15px;
    padding: 2px 6px;
    line-height: 1;
    display: none;
  }
  .search-clear.show { display: block; }
  .search-clear:hover { color: var(--text); }

  /* Tags below task text — small, faint, clickable */
  .task-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 1px;
  }
  .tag-pill {
    font-size: 10.5px;
    color: var(--faint);
    cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: transparent;
    border: none;
    padding: 0;
    letter-spacing: 0.02em;
    line-height: 1.4;
  }
  .tag-pill:hover { color: var(--text); }

  /* Columns — split layout for Open filter */
  #list.split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: stretch;
  }
  .column {
    min-width: 0;
    /* Guarantee a usable drop area even when a column has few or no tasks */
    min-height: 120px;
  }
  @media (max-width: 820px) {
    #list.split {
      display: block;
    }
    .column { margin-bottom: 28px; }
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  .section-head .name { color: var(--text); font-weight: 500; }
  .section-head .count { font-variant-numeric: tabular-nums; }
  .column-today .section-head .name::before {
    content: '\2605\00a0';
    color: var(--star);
  }

  /* Drag-and-drop between columns & reorder within */
  .task[draggable="true"] { cursor: grab; }
  .task.dragging {
    opacity: 0.35;
    cursor: grabbing;
  }
  .column.drop-active {
    background: var(--hair);
    border-radius: 3px;
    padding: 2px 8px;
    margin: -2px -8px;
  }
  /* Insertion-point indicator: thin line above or below the hovered row */
  .task.drop-above::before,
  .task.drop-below::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--accent);
    pointer-events: none;
    z-index: 2;
    border-radius: 1px;
  }
  .task.drop-above::before { top: -2px; }
  .task.drop-below::after { bottom: -2px; }

  /* Empty column message */
  .empty-col {
    color: var(--faint);
    font-size: 12.5px;
    padding: 14px 0;
    font-style: italic;
    line-height: 1.5;
  }

  /* Task */
  .task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 4px 0;
    border-bottom: 1px solid var(--divider);
    position: relative;
    line-height: 1.4;
  }

  .task .checkbox {
    appearance: none;
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--faint);
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 4px;
    position: relative;
    transition: border-color 0.15s, background 0.15s;
  }
  .task .checkbox:hover { border-color: var(--text); }
  .task .checkbox:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .task .checkbox:checked::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 1px;
    width: 10px;
    height: 5px;
    border-left: 1.5px solid var(--bg);
    border-bottom: 1.5px solid var(--bg);
    transform: rotate(-45deg);
  }

  .task .star {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    margin-top: 2px;
    font-size: 15px;
    line-height: 1;
    color: var(--faint);
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .task:hover .star { opacity: 1; }
  .task .star:hover { color: var(--star); }
  .task.starred .star {
    opacity: 1;
    color: var(--star);
  }

  .task .text {
    flex: 1;
    min-width: 0;
    cursor: text;
  }
  .task .task-text {
    word-break: break-word;
  }
  .task.done .task-text {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: var(--faint);
    text-decoration-thickness: 1px;
  }
  .task.snoozed .task-text { color: var(--muted); }

  .task .meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .task .stale {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--faint);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .task .stale.mid { color: var(--stale-mid); }
  .task .stale.old { color: var(--stale-old); }

  .task .snooze-badge {
    font-size: 11px;
    color: var(--snooze);
    cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .task .snooze-badge:hover { text-decoration: underline; }

  .task .hover-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    color: var(--faint);
    font-size: 13px;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .task:hover .hover-btn { opacity: 1; }
  .task .snooze-btn:hover { color: var(--snooze); }
  .task .delete:hover { color: var(--danger); font-size: 16px; }
  .task .delete { font-size: 16px; }

  /* Snooze picker */
  .snooze-picker {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .snooze-picker .chip {
    font-size: 11px;
    padding: 2px 8px;
    border: 1px solid var(--hair);
    border-radius: 2px;
    background: var(--bg);
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
  }
  .snooze-picker .chip:hover {
    color: var(--text);
    border-color: var(--text);
  }

  /* Edit mode */
  .task .task-text[contenteditable="true"] {
    outline: none;
    background: var(--hair);
    padding: 2px 4px;
    margin: -2px -4px;
    border-radius: 2px;
  }

  /* Empty state */
  .empty {
    color: var(--muted);
    font-size: 14px;
    padding: 40px 0;
    text-align: center;
    font-style: italic;
  }

  /* Footer */
  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-top: 1px solid var(--hair);
    padding: 10px 24px;
  }
  footer .inner {
    max-width: 1040px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12px;
  }
  footer .sync {
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  footer .sync .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--faint);
    flex-shrink: 0;
  }
  footer .sync.connected .dot { background: var(--accent); }
  footer button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    padding: 0;
  }
  footer button:hover { color: var(--text); }
  footer button.link { text-decoration: underline; text-underline-offset: 2px; }
  footer .actions { display: flex; gap: 18px; flex-wrap: wrap; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--text);
    color: var(--bg);
    padding: 8px 16px;
    border-radius: 2px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Mobile */
  @media (max-width: 600px) {
    body { padding: 32px 20px 160px; }
    .task .star { opacity: 0.3; }
    .task .hover-btn { opacity: 0.3; }
    footer .inner { font-size: 11px; }
  }
</style>
</head>
<body>

<nav class="list-tabs" id="list-tabs">
  <button class="tab active" data-list="work">work</button>
  <button class="tab" data-list="private">private</button>
</nav>

<header>
  <div class="date" id="date"></div>
  <div class="counts" id="counts"></div>
</header>

<div class="input-wrap">
  <input class="add" id="input" type="text" placeholder="New task &mdash; use #tag to group" autocomplete="off" />
  <button class="add-today" id="add-today" title="Add directly to Today (Shift+Enter)">
    <span class="star-glyph">&#9734;</span>today
  </button>
  <span class="hint-key">/</span>
  <div class="autocomplete" id="autocomplete"></div>
</div>

<div class="filters">
  <div class="filter-buttons">
    <button data-filter="open" class="active">Open</button>
    <button data-filter="all">All</button>
    <button data-filter="done">Done</button>
    <button class="clean-btn" id="clean-btn" title="Hide completed tasks from Open view"></button>
  </div>
  <div class="search-wrap">
    <input class="search" id="search" type="text" placeholder="Filter &mdash; text or #tag" autocomplete="off" />
    <button class="search-clear" id="search-clear" title="Clear filter">&times;</button>
  </div>
</div>

<main id="list"></main>

<footer>
  <div class="inner">
    <div class="sync" id="sync">
      <div class="dot"></div>
      <span id="sync-text">Connecting&hellip;</span>
      <button class="link" id="sync-btn" style="display:none"></button>
    </div>
    <div class="actions">
      <button id="standup">Copy standup</button>
      <button id="save">Save to file</button>
      <button id="load">Load from file</button>
      <button id="clear" title="Permanently delete all completed tasks">Delete done</button>
    </div>
  </div>
  <input type="file" id="file-input" accept=".json" hidden />
</footer>

<div class="toast" id="toast"></div>

<script type="module">
  // ===== Firebase SDK + init =====
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js';
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js';
  import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBekFxmXiRC3dY_WCZCy5hl0AFeJfXBw1U",
    authDomain: "zs-to-do-v1.firebaseapp.com",
    projectId: "zs-to-do-v1",
    storageBucket: "zs-to-do-v1.firebasestorage.app",
    messagingSenderId: "646062619214",
    appId: "1:646062619214:web:e3ba77893cc0051bb1611f",
    measurementId: "G-YHNR46MJP5"
  };
  const fbApp = initializeApp(firebaseConfig);
  const fbDb = getFirestore(fbApp);
  const fbAuth = getAuth(fbApp);
  const STATE_DOC = doc(fbDb, 'app', 'state');

  // ===== Constants =====
  const STORAGE_KEY = 'minimal-tasks-v3';
  const STORAGE_KEY_V2 = 'minimal-tasks-v2';
  const STORAGE_KEY_V1 = 'minimal-tasks-v1';
  const DAY = 86400000;
  const LIST_NAMES = ['work', 'private'];

  // ===== State =====
  // State is kept as { version, lists: { work: [...], private: [...] }, activeList }.
  // A dynamic `state.tasks` getter resolves to the current list so the rest of the
  // code can keep using state.tasks for both reads and writes.
  function initState(raw) {
    if (!raw || typeof raw !== 'object') raw = {};
    if (!raw.lists || typeof raw.lists !== 'object') {
      // Migrate from v1/v2 shape: single tasks array becomes the work list
      raw.lists = { work: Array.isArray(raw.tasks) ? raw.tasks : [], private: [] };
      delete raw.tasks;
    }
    if (!Array.isArray(raw.lists.work)) raw.lists.work = [];
    if (!Array.isArray(raw.lists.private)) raw.lists.private = [];
    if (!LIST_NAMES.includes(raw.activeList)) raw.activeList = 'work';
    raw.version = 3;
    Object.defineProperty(raw, 'tasks', {
      get() { return this.lists[this.activeList]; },
      set(val) { this.lists[this.activeList] = val; },
      enumerable: false,
      configurable: true,
    });
    return raw;
  }
  let state = initState({});
  let filter = 'open';
  let searchQuery = '';
  let openSnoozePickerId = null;
  let autocompleteIndex = -1;
  let autocompleteMatches = [];
  // Firestore sync status: 'connecting' | 'synced' | 'saving' | 'offline' | 'error'
  let syncStatus = 'connecting';
  let fbUnsubscribe = null;
  let suppressNextSnapshot = false;

  // ===== Date helpers =====
  function todayMidnight() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }
  function tomorrowMidnight() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }
  function nextMondayMidnight() {
    const d = new Date();
    const day = d.getDay(); // 0=Sun ... 6=Sat
    const daysUntilMon = ((8 - day) % 7) || 7;
    d.setDate(d.getDate() + daysUntilMon);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }
  function sevenDays() {
    const d = new Date();
    d.setDate(d.getDate() + 7);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }
  function formatDate() {
    return new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }
  function formatSnoozeUntil(ts) {
    const d = new Date(ts);
    const diffDays = Math.ceil((ts - Date.now()) / DAY);
    if (diffDays <= 1) return 'tomorrow';
    if (diffDays <= 6) return d.toLocaleDateString(undefined, { weekday: 'short' }).toLowerCase();
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }).toLowerCase();
  }
  function daysSince(ts) {
    return Math.floor((Date.now() - ts) / DAY);
  }

  // ===== Storage =====
  function saveLocal() {
    try {
      // JSON.stringify ignores the non-enumerable `tasks` getter; only lists + activeList + version serialize.
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* sandbox may block */ }
  }
  function loadLocal() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
      const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
      if (rawV2) return JSON.parse(rawV2); // initState will upgrade shape
      const rawV1 = localStorage.getItem(STORAGE_KEY_V1);
      if (rawV1) return migrateV1(JSON.parse(rawV1));
    } catch (e) {}
    return null;
  }
  function migrateV1(data) {
    const tasks = (data.tasks || []).map(t => ({
      ...t,
      starred: false,
      starredAt: 0,
      snoozedUntil: null,
    }));
    return { version: 2, tasks };
  }

  // ===== Cleanup on load =====
  function cleanupState() {
    const now = Date.now();
    for (const listName of LIST_NAMES) {
      (state.lists[listName] || []).forEach(t => {
        // Backfill tags array for tasks created before multi-tag support
        if (!Array.isArray(t.tags)) {
          t.tags = (t.workstream && t.workstream !== 'inbox') ? [t.workstream] : [];
        }
        if (!t.workstream) {
          t.workstream = t.tags[0] || 'inbox';
        }
        // Backfill clearedFromOpen: existing done tasks default to already-cleared
        // so Open view doesn't flood with historical check-offs on first load.
        if (typeof t.clearedFromOpen !== 'boolean') {
          t.clearedFromOpen = !!t.done;
        }
        // Clear elapsed snoozes (starred tasks persist indefinitely — intentional)
        if (t.snoozedUntil && t.snoozedUntil <= now) {
          t.snoozedUntil = null;
        }
      });
    }
  }

  // ===== Task parsing =====
  function parseTask(raw) {
    const text = raw.trim();
    if (!text) return null;
    const matches = text.match(/#(\S+)/g) || [];
    const tags = Array.from(new Set(matches.map(m => m.slice(1).toLowerCase())));
    const cleanText = text.replace(/#\S+/g, '').replace(/\s+/g, ' ').trim();
    if (!cleanText) return null;
    return {
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())),
      text: cleanText,
      tags,
      workstream: tags[0] || 'inbox', // first tag drives grouping; kept for back-compat
      done: false,
      clearedFromOpen: false,
      createdAt: Date.now(),
      starred: false,
      starredAt: 0,
      snoozedUntil: null,
    };
  }

  // ===== Rendering =====
  function render() {
    document.getElementById('date').textContent = formatDate();

    const open = state.tasks.filter(t => !t.done).length;
    const done = state.tasks.filter(t => t.done).length;
    document.getElementById('counts').textContent = `${open} open \u00B7 ${done} done`;

    updateCleanButton();

    const list = document.getElementById('list');
    list.innerHTML = '';
    list.classList.remove('split');

    // Determine visibility: status filter + search filter
    const now = Date.now();
    let visible;
    if (filter === 'open') {
      // Keep checked tasks visible with strikethrough until the Clean button is used
      visible = state.tasks.filter(t =>
        !(t.done && t.clearedFromOpen) && !(t.snoozedUntil && t.snoozedUntil > now)
      );
    } else if (filter === 'done') {
      visible = state.tasks.filter(t => t.done);
    } else {
      visible = state.tasks.slice();
    }
    if (searchQuery) {
      visible = visible.filter(t => matchesSearch(t, searchQuery));
    }

    if (visible.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      if (searchQuery) {
        empty.textContent = `No tasks match ${JSON.stringify(searchQuery)}.`;
      } else {
        empty.textContent = filter === 'done'
          ? 'Nothing checked off yet.'
          : filter === 'open'
          ? 'Nothing pending. Add a task above.'
          : 'No tasks yet. Add one above.';
      }
      list.appendChild(empty);
      return;
    }

    if (filter === 'open') {
      // Split layout: today (starred) | others (unstarred)
      list.classList.add('split');
      const starred = visible.filter(t => t.starred);
      const rest = visible.filter(t => !t.starred);
      list.appendChild(renderColumn('today', starred));
      list.appendChild(renderColumn('others', rest));
    } else {
      // Flat list for All / Done — starred items float to top in All
      const ordered = (filter === 'all')
        ? visible.slice().sort((a, b) => (b.starred ? 1 : 0) - (a.starred ? 1 : 0))
        : visible;
      ordered.forEach(t => list.appendChild(renderTask(t)));
    }
  }

  function renderColumn(name, tasks) {
    const col = document.createElement('section');
    col.className = 'column column-' + name;
    col.dataset.col = name;

    const head = document.createElement('div');
    head.className = 'section-head';
    const openCount = tasks.filter(t => !t.done).length;
    head.innerHTML = `<span class="name">${name}</span><span class="count">${openCount}</span>`;
    col.appendChild(head);

    if (tasks.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-col';
      empty.textContent = name === 'today'
        ? 'Drag tasks here, or use \u2606 today to add directly.'
        : 'Nothing here.';
      col.appendChild(empty);
    } else {
      tasks.forEach(t => col.appendChild(renderTask(t, { draggable: true })));
    }

    // Drop-zone handlers — accept dragged tasks for star/unstar + reorder
    col.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('drop-active');
    });
    col.addEventListener('dragleave', (e) => {
      // Only clear if we really left (not just entered a child)
      if (col.contains(e.relatedTarget)) return;
      col.classList.remove('drop-active');
      // Clear insertion indicators that belonged to this column
      col.querySelectorAll('.task.drop-above, .task.drop-below').forEach(el => {
        el.classList.remove('drop-above', 'drop-below');
      });
      if (dropTarget && col.querySelector(`.task[data-id="${dropTarget.taskId}"]`)) {
        dropTarget = null;
      }
    });
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      col.classList.remove('drop-active');
      const id = e.dataTransfer.getData('text/plain');
      if (!id) { clearDropIndicators(); return; }

      const newStarred = (name === 'today');
      let targetId = null;
      let position = 'end';

      if (dropTarget && dropTarget.taskId && dropTarget.taskId !== id) {
        // Precise hit: user hovered a specific row and we saw the indicator
        targetId = dropTarget.taskId;
        position = dropTarget.position;
      } else {
        // Fallback: compute insertion point from cursor Y versus each row's midpoint.
        // This covers drops on the column header, between rows, or in empty space.
        const dropY = e.clientY;
        const rows = Array.from(col.querySelectorAll('.task'))
          .filter(r => r.dataset.id !== id);
        if (rows.length > 0) {
          let inserted = false;
          for (const r of rows) {
            const rect = r.getBoundingClientRect();
            if (dropY < rect.top + rect.height / 2) {
              targetId = r.dataset.id;
              position = 'above';
              inserted = true;
              break;
            }
          }
          if (!inserted) {
            targetId = rows[rows.length - 1].dataset.id;
            position = 'below';
          }
        }
      }

      moveTaskRelative(id, targetId, position, newStarred);
      clearDropIndicators();
    });

    return col;
  }

  function renderTask(t, options) {
    const now = Date.now();
    const isSnoozed = t.snoozedUntil && t.snoozedUntil > now;
    const row = document.createElement('div');
    row.className = 'task'
      + (t.done ? ' done' : '')
      + (t.starred ? ' starred' : '')
      + (isSnoozed ? ' snoozed' : '');
    row.dataset.id = t.id;

    if (options && options.draggable && !t.done) {
      row.draggable = true;
      row.addEventListener('dragstart', (e) => {
        currentDragId = t.id;
        e.dataTransfer.setData('text/plain', t.id);
        e.dataTransfer.effectAllowed = 'move';
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', () => {
        currentDragId = null;
        row.classList.remove('dragging');
        clearDropIndicators();
      });
      // Show insertion indicator above/below based on cursor position within this row
      row.addEventListener('dragover', (e) => {
        if (!currentDragId || currentDragId === t.id) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const rect = row.getBoundingClientRect();
        const position = (e.clientY - rect.top) < rect.height / 2 ? 'above' : 'below';
        // Clear indicators on other rows, update this one
        document.querySelectorAll('.task.drop-above, .task.drop-below').forEach(el => {
          if (el !== row) el.classList.remove('drop-above', 'drop-below');
        });
        row.classList.toggle('drop-above', position === 'above');
        row.classList.toggle('drop-below', position === 'below');
        dropTarget = { taskId: t.id, position };
      });
    }

    // Checkbox
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'checkbox';
    cb.checked = t.done;
    cb.addEventListener('change', () => toggleDone(t.id));
    row.appendChild(cb);

    // Star (only for not-done tasks)
    if (!t.done) {
      const star = document.createElement('button');
      star.className = 'star';
      star.textContent = t.starred ? '\u2605' : '\u2606';
      star.title = t.starred ? 'Remove from today' : 'Add to today';
      star.addEventListener('click', () => toggleStar(t.id));
      row.appendChild(star);
    }

    // Text + tags shown below (all tags, small and faint)
    const txt = document.createElement('div');
    txt.className = 'text';
    const textSpan = document.createElement('span');
    textSpan.className = 'task-text';
    textSpan.textContent = t.text;
    textSpan.addEventListener('dblclick', () => startEdit(textSpan, t.id));
    txt.appendChild(textSpan);

    const allTags = Array.isArray(t.tags) ? t.tags : [];
    if (allTags.length > 0) {
      const tagsWrap = document.createElement('div');
      tagsWrap.className = 'task-tags';
      allTags.forEach(tag => {
        const pill = document.createElement('button');
        pill.className = 'tag-pill';
        pill.textContent = '#' + tag;
        pill.title = `Filter to #${tag}`;
        pill.addEventListener('click', (e) => {
          e.stopPropagation();
          filterByTag(tag);
        });
        tagsWrap.appendChild(pill);
      });
      txt.appendChild(tagsWrap);
    }
    row.appendChild(txt);

    // Meta (right side)
    const meta = document.createElement('div');
    meta.className = 'meta';

    // Snooze badge (if snoozed and visible in All filter)
    if (isSnoozed) {
      const badge = document.createElement('span');
      badge.className = 'snooze-badge';
      badge.textContent = formatSnoozeUntil(t.snoozedUntil);
      badge.title = 'Click to un-snooze';
      badge.addEventListener('click', () => unsnooze(t.id));
      meta.appendChild(badge);
    }

    // Age indicator — different threshold for starred vs backlog
    //   Starred: counts days since star (how long stuck in Today), shows at >=1d
    //   Backlog: counts days since created, shows at >=3d
    if (!t.done && !isSnoozed) {
      const baseline = t.starred ? (t.starredAt || t.createdAt) : t.createdAt;
      const days = daysSince(baseline);
      const threshold = t.starred ? 1 : 3;
      if (days >= threshold) {
        const stale = document.createElement('span');
        stale.className = 'stale';
        if (days >= 14) {
          stale.classList.add('old');
          stale.textContent = '14d+';
        } else if (days >= 7) {
          stale.classList.add('old');
          stale.textContent = days + 'd';
        } else if (days >= 3) {
          stale.classList.add('mid');
          stale.textContent = days + 'd';
        } else {
          stale.textContent = days + 'd';
        }
        stale.title = t.starred
          ? `In Today for ${days} day${days > 1 ? 's' : ''}`
          : `Added ${days} day${days > 1 ? 's' : ''} ago`;
        meta.appendChild(stale);
      }
    }

    // Snooze picker inline (if open)
    if (openSnoozePickerId === t.id) {
      const picker = document.createElement('div');
      picker.className = 'snooze-picker';
      const mkChip = (label, ts) => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.textContent = label;
        b.addEventListener('click', (e) => { e.stopPropagation(); snooze(t.id, ts); });
        return b;
      };
      picker.appendChild(mkChip('tomorrow', tomorrowMidnight()));
      picker.appendChild(mkChip('mon', nextMondayMidnight()));
      picker.appendChild(mkChip('+7d', sevenDays()));
      const cancel = document.createElement('button');
      cancel.className = 'chip';
      cancel.textContent = '\u00D7';
      cancel.addEventListener('click', (e) => { e.stopPropagation(); openSnoozePickerId = null; render(); });
      picker.appendChild(cancel);
      meta.appendChild(picker);
    } else if (!t.done && !isSnoozed) {
      // Snooze button (hover)
      const sn = document.createElement('button');
      sn.className = 'hover-btn snooze-btn';
      sn.textContent = 'z';
      sn.title = 'Snooze';
      sn.addEventListener('click', (e) => {
        e.stopPropagation();
        openSnoozePickerId = t.id;
        render();
      });
      meta.appendChild(sn);
    }

    // Delete
    const del = document.createElement('button');
    del.className = 'hover-btn delete';
    del.textContent = '\u00D7';
    del.title = 'Delete';
    del.addEventListener('click', () => remove(t.id));
    meta.appendChild(del);

    row.appendChild(meta);
    return row;
  }

  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  function updateCleanButton() {
    const btn = document.getElementById('clean-btn');
    const count = state.tasks.filter(t => t.done && !t.clearedFromOpen).length;
    if (filter === 'open' && count > 0) {
      btn.innerHTML = `clean ${count} <span class="check">\u2713</span>`;
      btn.classList.add('show');
    } else {
      btn.classList.remove('show');
    }
  }

  // ===== Actions =====
  function add(raw, options) {
    const t = parseTask(raw);
    if (!t) return;
    if (options && options.toToday) {
      t.starred = true;
      t.starredAt = Date.now();
    }
    state.tasks.unshift(t);
    persist();
  }
  function toggleDone(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    if (!t.done) {
      // Un-checked: ensure it reappears properly in Open view
      t.clearedFromOpen = false;
    }
    persist();
  }

  function cleanDone() {
    // Hide all done+notYetCleared tasks from Open view (soft clear)
    let changed = false;
    state.tasks.forEach(t => {
      if (t.done && !t.clearedFromOpen) {
        t.clearedFromOpen = true;
        changed = true;
      }
    });
    if (changed) persist();
  }

  // ===== Drag reorder state =====
  // currentDragId: id of the task being dragged (set on dragstart, cleared on dragend)
  // dropTarget: { taskId, position } where to insert on drop; null = append to end
  let currentDragId = null;
  let dropTarget = null;

  function clearDropIndicators() {
    document.querySelectorAll('.task.drop-above, .task.drop-below').forEach(el => {
      el.classList.remove('drop-above', 'drop-below');
    });
    dropTarget = null;
  }

  // Universal move: handles reorder within column AND cross-column star/unstar in one pass.
  //   targetId + position='above'|'below' places moved task adjacent to targetId
  //   position='end' (or targetId null) appends to the end
  //   newStarred toggles today/others state if different from current
  function moveTaskRelative(movedId, targetId, position, newStarred) {
    const task = state.tasks.find(t => t.id === movedId);
    if (!task) return;

    // Update starred state only if different (preserves starredAt when staying in same column)
    if (newStarred === true && !task.starred) {
      task.starred = true;
      task.starredAt = Date.now();
      task.snoozedUntil = null;
    } else if (newStarred === false && task.starred) {
      task.starred = false;
    }

    // Remove from current position
    const currentIdx = state.tasks.findIndex(t => t.id === movedId);
    if (currentIdx === -1) return;
    state.tasks.splice(currentIdx, 1);

    // Insert at new position
    if (position === 'end' || !targetId) {
      state.tasks.push(task);
    } else {
      let targetIdx = state.tasks.findIndex(t => t.id === targetId);
      if (targetIdx === -1) {
        state.tasks.push(task);
      } else {
        if (position === 'below') targetIdx++;
        state.tasks.splice(targetIdx, 0, task);
      }
    }

    persist();
  }
  function toggleStar(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    if (t.starred) {
      t.starred = false;
      t.starredAt = 0;
    } else {
      t.starred = true;
      t.starredAt = Date.now();
      t.snoozedUntil = null;
    }
    persist();
  }
  function snooze(id, until) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    t.snoozedUntil = until;
    t.starred = false;
    openSnoozePickerId = null;
    persist();
  }
  function unsnooze(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    t.snoozedUntil = null;
    persist();
  }
  function remove(id) {
    state.tasks = state.tasks.filter(x => x.id !== id);
    persist();
  }
  function clearDone() {
    const count = state.tasks.filter(t => t.done).length;
    if (count === 0) { toast('Nothing to clear'); return; }
    if (!confirm(`Remove ${count} completed task${count > 1 ? 's' : ''}?`)) return;
    state.tasks = state.tasks.filter(t => !t.done);
    persist();
  }
  function startEdit(el, id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    // Show full raw string including hashtags so user can edit tags too
    const row = el.closest('.task');
    const tagsEl = row ? row.querySelector('.task-tags') : null;
    if (tagsEl) tagsEl.style.display = 'none';
    const fullString = t.text + ((t.tags && t.tags.length) ? ' ' + t.tags.map(tg => '#' + tg).join(' ') : '');
    el.textContent = fullString;
    el.contentEditable = 'true';
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    function finish() {
      el.contentEditable = 'false';
      el.removeEventListener('blur', finish);
      el.removeEventListener('keydown', onKey);
      const raw = el.textContent.trim();
      if (!raw) { render(); return; }
      const matches = raw.match(/#(\S+)/g) || [];
      const newTags = Array.from(new Set(matches.map(m => m.slice(1).toLowerCase())));
      const cleanText = raw.replace(/#\S+/g, '').replace(/\s+/g, ' ').trim();
      if (!cleanText) { render(); return; }
      const task = state.tasks.find(x => x.id === id);
      if (task) {
        task.text = cleanText;
        task.tags = newTags;
        task.workstream = newTags[0] || 'inbox';
        persist();
      } else {
        render();
      }
    }
    function onKey(e) {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      if (e.key === 'Escape') { render(); el.blur(); }
    }
    el.addEventListener('blur', finish);
    el.addEventListener('keydown', onKey);
  }

  // ===== Persist (local cache + Firestore) =====
  function persist() {
    saveLocal();
    saveFirestore();
    render();
  }

  // Serialize state to a plain object Firestore can store (strips the non-enumerable `tasks` getter).
  function stateForFirestore() {
    return JSON.parse(JSON.stringify(state));
  }

  async function saveFirestore() {
    try {
      updateSyncUI('saving');
      // Mark that the snapshot our own write will trigger should be ignored.
      suppressNextSnapshot = true;
      await setDoc(STATE_DOC, { ...stateForFirestore(), _updatedAt: Date.now() });
      updateSyncUI('synced');
    } catch (e) {
      console.warn('Firestore write failed:', e);
      updateSyncUI('error');
      suppressNextSnapshot = false;
    }
  }

  function subscribeFirestore() {
    if (fbUnsubscribe) fbUnsubscribe();
    fbUnsubscribe = onSnapshot(STATE_DOC, (snap) => {
      // Ignore the snapshot that fires in response to our own write.
      if (snap.metadata.hasPendingWrites) return;
      if (suppressNextSnapshot) { suppressNextSnapshot = false; return; }
      if (!snap.exists()) return;
      const data = snap.data();
      delete data._updatedAt;
      state = initState(data);
      cleanupState();
      saveLocal();
      renderTabs();
      render();
    }, (err) => {
      console.warn('Firestore snapshot error:', err);
      updateSyncUI('offline');
    });
  }

  // ===== Standup clipboard =====
  function copyStandup() {
    const now = Date.now();
    const openTasks = state.tasks.filter(t => !t.done && !(t.snoozedUntil && t.snoozedUntil > now));
    if (openTasks.length === 0) { toast('No open tasks'); return; }

    const dateStr = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    // Starred items first, then the rest in original order
    const sorted = openTasks.slice().sort((a, b) => (b.starred ? 1 : 0) - (a.starred ? 1 : 0));

    const lines = [`${dateStr} — open tasks`, ''];
    sorted.forEach(t => {
      const tagStr = (t.tags || []).map(tg => '#' + tg).join(' ');
      lines.push(`- ${t.starred ? '★ ' : ''}${t.text}${tagStr ? ' ' + tagStr : ''}`);
    });

    const text = lines.join('\n').trim();
    navigator.clipboard.writeText(text).then(
      () => toast('Copied'),
      () => toast('Copy failed — try again')
    );
  }

  // ===== Toast =====
  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  // ===== Export / Import JSON =====
  function exportJSON() {
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `tasks-${d}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }
  function importJSON(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        const normalized = normalizeLoadedData(data);
        if (!normalized) throw new Error('bad shape');
        const currentTotal = totalTaskCount(state);
        const newTotal = totalTaskCount(normalized);
        if (currentTotal > 0) {
          if (!confirm(`Replace ${currentTotal} current tasks with ${newTotal} from file?`)) return;
        }
        state = initState(normalized);
        cleanupState();
        persist();
        renderTabs();
      } catch (err) {
        alert('Could not read that file. Make sure it is a tasks JSON file.');
      }
    };
    reader.readAsText(file);
  }
  function normalizeLoadedData(data) {
    if (!data || typeof data !== 'object') return null;
    // v3 shape (has lists) — pass through
    if (data.lists && typeof data.lists === 'object') return data;
    // v1 or v2 shape (flat tasks array) — upgrade to v3 with work=tasks, private=[]
    if (!Array.isArray(data.tasks)) return null;
    const v2 = (data.version && data.version >= 2) ? data : migrateV1(data);
    return {
      version: 3,
      lists: { work: v2.tasks || [], private: [] },
      activeList: 'work',
    };
  }

  function totalTaskCount(s) {
    if (!s) return 0;
    if (Array.isArray(s.tasks)) return s.tasks.length; // raw v2 shape
    if (!s.lists) return 0;
    return LIST_NAMES.reduce((n, k) => n + ((s.lists[k] && s.lists[k].length) || 0), 0);
  }

  // ===== Sync status indicator (Firestore) =====
  function updateSyncUI(status) {
    if (status) syncStatus = status;
    const sync = document.getElementById('sync');
    const text = document.getElementById('sync-text');
    const btn = document.getElementById('sync-btn');
    sync.classList.toggle('connected', syncStatus === 'synced');
    const labels = {
      connecting: 'Connecting…',
      synced: 'Synced',
      saving: 'Saving…',
      offline: 'Offline',
      error: 'Sync error'
    };
    text.textContent = labels[syncStatus] || syncStatus;
    btn.style.display = 'none'; // No action button needed; Firestore handles sync automatically
  }

  // ===== Autocomplete =====
  function updateAutocomplete() {
    const inp = document.getElementById('input');
    const ac = document.getElementById('autocomplete');
    const val = inp.value;
    const pos = inp.selectionStart;

    // Find current word around cursor
    const before = val.slice(0, pos);
    const match = before.match(/#(\S*)$/);
    if (!match) {
      ac.classList.remove('show');
      autocompleteMatches = [];
      autocompleteIndex = -1;
      return;
    }
    const partial = match[1].toLowerCase();

    // Collect unique tags across all tasks (not just primary workstreams)
    const allTags = Array.from(new Set(
      state.tasks.flatMap(t => Array.isArray(t.tags) ? t.tags : [t.workstream]).filter(Boolean)
    )).filter(tag => tag !== 'inbox');

    const matches = allTags
      .filter(tag => tag.startsWith(partial) && tag !== partial)
      .sort()
      .slice(0, 5);

    if (matches.length === 0) {
      ac.classList.remove('show');
      autocompleteMatches = [];
      autocompleteIndex = -1;
      return;
    }

    autocompleteMatches = matches;
    if (autocompleteIndex >= matches.length) autocompleteIndex = 0;
    if (autocompleteIndex < 0) autocompleteIndex = 0;

    ac.innerHTML = '';
    matches.forEach((m, i) => {
      const item = document.createElement('div');
      item.className = 'item' + (i === autocompleteIndex ? ' active' : '');
      item.innerHTML = `<span class="hash">#</span>${escapeHTML(m)}`;
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        applyCompletion(m);
      });
      ac.appendChild(item);
    });
    ac.classList.add('show');
  }

  function applyCompletion(tag) {
    const inp = document.getElementById('input');
    const val = inp.value;
    const pos = inp.selectionStart;
    const before = val.slice(0, pos);
    const after = val.slice(pos);
    const newBefore = before.replace(/#(\S*)$/, `#${tag} `);
    inp.value = newBefore + after;
    const newPos = newBefore.length;
    inp.setSelectionRange(newPos, newPos);
    document.getElementById('autocomplete').classList.remove('show');
    autocompleteMatches = [];
    autocompleteIndex = -1;
    inp.focus();
  }

  // ===== Search / tag filtering =====
  //   Query is space-separated tokens, all must match (AND).
  //   Token prefixed with # → tag starts-with match.
  //   Plain token → substring match in text OR any tag.
  function matchesSearch(t, query) {
    const q = (query || '').trim().toLowerCase();
    if (!q) return true;
    const tokens = q.split(/\s+/).filter(Boolean);
    const textLower = (t.text || '').toLowerCase();
    const tags = Array.isArray(t.tags) ? t.tags : [];
    for (const token of tokens) {
      if (token.startsWith('#')) {
        const tagPart = token.slice(1);
        if (!tagPart) continue;
        if (!tags.some(tg => tg.startsWith(tagPart))) return false;
      } else {
        const inText = textLower.includes(token);
        const inTag = tags.some(tg => tg.includes(token));
        if (!inText && !inTag) return false;
      }
    }
    return true;
  }

  function filterByTag(tag) {
    searchQuery = '#' + tag;
    const search = document.getElementById('search');
    search.value = searchQuery;
    document.getElementById('search-clear').classList.add('show');
    openSnoozePickerId = null;
    render();
  }

  function clearSearch() {
    searchQuery = '';
    const search = document.getElementById('search');
    search.value = '';
    document.getElementById('search-clear').classList.remove('show');
    render();
  }

  // ===== Event wiring =====
  const input = document.getElementById('input');
  input.addEventListener('input', updateAutocomplete);
  input.addEventListener('keyup', (e) => {
    // Reposition autocomplete on cursor move keys
    if (['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) updateAutocomplete();
  });
  input.addEventListener('keydown', (e) => {
    const ac = document.getElementById('autocomplete');
    const showing = ac.classList.contains('show');

    if (showing) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        autocompleteIndex = (autocompleteIndex + 1) % autocompleteMatches.length;
        updateAutocomplete();
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        autocompleteIndex = (autocompleteIndex - 1 + autocompleteMatches.length) % autocompleteMatches.length;
        updateAutocomplete();
        return;
      }
      if (e.key === 'Tab' || (e.key === 'Enter' && autocompleteMatches.length > 0 && autocompleteIndex >= 0)) {
        // Tab always completes; Enter completes only if an item is highlighted
        if (e.key === 'Tab' || autocompleteIndex >= 0) {
          e.preventDefault();
          applyCompletion(autocompleteMatches[Math.max(0, autocompleteIndex)]);
          return;
        }
      }
      if (e.key === 'Escape') {
        ac.classList.remove('show');
        autocompleteMatches = [];
        autocompleteIndex = -1;
        return;
      }
    }

    if (e.key === 'Enter') {
      add(input.value, { toToday: e.shiftKey });
      input.value = '';
      ac.classList.remove('show');
    } else if (e.key === 'Escape') {
      input.value = '';
      input.blur();
    }
  });
  input.addEventListener('blur', () => {
    setTimeout(() => document.getElementById('autocomplete').classList.remove('show'), 150);
  });

  // "☆ today" button inside input: add current text as a starred task
  document.getElementById('add-today').addEventListener('click', () => {
    add(input.value, { toToday: true });
    input.value = '';
    document.getElementById('autocomplete').classList.remove('show');
    input.focus();
  });

  document.querySelectorAll('.filter-buttons button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-buttons button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      openSnoozePickerId = null;
      render();
    });
  });

  // Search field
  const search = document.getElementById('search');
  search.addEventListener('input', () => {
    searchQuery = search.value;
    document.getElementById('search-clear').classList.toggle('show', !!searchQuery.trim());
    render();
  });
  search.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      clearSearch();
      search.blur();
    }
  });
  document.getElementById('search-clear').addEventListener('click', clearSearch);

  document.getElementById('clean-btn').addEventListener('click', cleanDone);
  document.getElementById('standup').addEventListener('click', copyStandup);
  document.getElementById('save').addEventListener('click', exportJSON);
  document.getElementById('clear').addEventListener('click', clearDone);
  document.getElementById('load').addEventListener('click', () => {
    document.getElementById('file-input').click();
  });
  document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) importJSON(file);
    e.target.value = '';
  });

  // ===== List tabs (work / private) =====
  function renderTabs() {
    document.querySelectorAll('.list-tabs .tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.list === state.activeList);
    });
  }
  function setActiveList(name) {
    if (!LIST_NAMES.includes(name) || name === state.activeList) return;
    state.activeList = name;
    // Reset search when switching contexts; keep status filter as-is
    searchQuery = '';
    document.getElementById('search').value = '';
    document.getElementById('search-clear').classList.remove('show');
    openSnoozePickerId = null;
    renderTabs();
    persist();
  }
  document.querySelectorAll('.list-tabs .tab').forEach(btn => {
    btn.addEventListener('click', () => setActiveList(btn.dataset.list));
  });

  // Global `/` to focus add input, `s` to focus search
  document.addEventListener('keydown', (e) => {
    const active = document.activeElement;
    const inField = active === input || active === search
      || (active && active.contentEditable === 'true')
      || (active && active.tagName === 'INPUT');
    if (e.metaKey || e.ctrlKey) return;
    if (e.key === '/' && !inField) {
      e.preventDefault();
      input.focus();
    } else if (e.key === 's' && !inField) {
      e.preventDefault();
      search.focus();
    }
  });

  // Close snooze picker on outside click
  document.addEventListener('click', (e) => {
    if (openSnoozePickerId && !e.target.closest('.snooze-picker') && !e.target.closest('.snooze-btn')) {
      openSnoozePickerId = null;
      render();
    }
  });

  // Re-render once per minute so stale indicators & snooze expiries update
  setInterval(() => {
    const now = Date.now();
    let changed = false;
    for (const listName of LIST_NAMES) {
      (state.lists[listName] || []).forEach(t => {
        if (t.snoozedUntil && t.snoozedUntil <= now) {
          t.snoozedUntil = null;
          changed = true;
        }
      });
    }
    if (changed) persist();
    else render();
  }, 60000);

  // ===== Init =====
  (async function init() {
    // 1) Load from local cache immediately so there's no blank screen while Firestore connects
    const local = loadLocal();
    if (local) state = initState(local);
    cleanupState();
    renderTabs();
    updateSyncUI('connecting');
    render();

    // 2) Sign in anonymously, then pull canonical state from Firestore
    try {
      await signInAnonymously(fbAuth);
      const snap = await getDoc(STATE_DOC);
      if (snap.exists()) {
        const data = snap.data();
        delete data._updatedAt;
        state = initState(data);
        cleanupState();
        saveLocal();
        renderTabs();
        render();
      } else {
        // First-ever load on any device — push whatever's in local cache up to Firestore
        await setDoc(STATE_DOC, { ...stateForFirestore(), _updatedAt: Date.now() });
      }
      updateSyncUI('synced');
      // 3) Subscribe to realtime updates from other devices
      subscribeFirestore();
    } catch (e) {
      console.warn('Firestore init failed:', e);
      updateSyncUI('offline');
      // Retry subscription when we come back online
      window.addEventListener('online', () => {
        updateSyncUI('connecting');
        signInAnonymously(fbAuth)
          .then(() => { updateSyncUI('synced'); subscribeFirestore(); })
          .catch(() => updateSyncUI('offline'));
      }, { once: true });
    }
  })();
</script>

</body>
</html>
